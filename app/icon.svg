<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#027361" />
      <stop offset="50%" stop-color="#038c71" />
      <stop offset="100%" stop-color="#04a882" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#brandGradient)" filter="url(#shadow)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="10" />

  <!-- Inner Soft Glow Circle -->
  <circle cx="256" cy="256" r="190" fill="#025e4f" fill-opacity="0.4" />

  <!-- Thai Letter "ร" (อายุน้อยร้อยโรตี) -->
  <text
    x="256"
    y="330"
    font-family="'Noto Sans Thai', 'Thonburi', 'Leelawadee UI', 'Tahoma', 'sans-serif'"
    font-size="280"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="central"
  >
    ร
  </text>
</svg>
